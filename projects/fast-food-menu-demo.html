<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Demo: Interactive Fast-Food Menu — MAK UI Studio</title>
  <meta name="robots" content="noindex, follow" />
  <link href="/favicon.png" rel="icon" type="image/png" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding-bottom: 3rem;
    }

    /* Slim Top Demo Navigation Bar */
    .demo-topbar {
      background: #020617;
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .demo-topbar a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.2s;
    }

    .demo-topbar a:hover {
      color: #7dd3fc;
    }

    .demo-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* App Header */
    header {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand span {
      color: var(--accent);
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 340px;
      min-width: 220px;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Main Two-Column Layout */
    .container {
      max-width: 1200px;
      margin: 1.75rem auto 0;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Category Filter Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text);
      border-color: #475569;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    /* Menu Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .food-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .food-card:hover {
      transform: translateY(-3px);
      border-color: #475569;
    }

    .food-emoji {
      font-size: 2.75rem;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .food-category {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .food-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .food-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    .food-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
    }

    .food-price {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .add-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.5rem 0.95rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .add-btn:hover {
      background: var(--accent-hover);
    }

    .add-btn:active {
      transform: scale(0.96);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
    }

    /* Sticky Order Tray */
    .cart-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem;
      position: sticky;
      top: 5.25rem;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .cart-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      background: var(--accent);
      color: #0f172a;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .clear-btn:hover {
      color: var(--danger);
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 1.25rem;
    }

    .cart-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2rem 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.55);
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(51, 65, 85, 0.6);
    }

    .cart-item-info h4 {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .cart-item-info span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .qty-val {
      font-size: 0.88rem;
      font-weight: 700;
      min-width: 18px;
      text-align: center;
    }

    /* Totals */
    .totals {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-size: 0.9rem;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
    }

    .total-row.grand {
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 0.35rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }

    .checkout-btn {
      width: 100%;
      margin-top: 1.1rem;
      background: var(--success);
      color: #052e16;
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .checkout-btn:hover:not(:disabled) {
      opacity: 0.92;
    }

    .checkout-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Toast Notification with Forced Reflow Fix */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 99999;
      pointer-events: none;
    }

    .toast {
      background: #020617;
      color: var(--text);
      border: 1px solid var(--accent);
      border-left: 4px solid var(--accent);
      padding: 0.85rem 1.2rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Back to Lesson -->
  <div class="demo-topbar">
    <a href="/projects/fast-food-menu.html">← Back to Lesson &amp; Source Code</a>
    <span class="demo-badge">Live Demo • MAK UI Studio</span>
  </div>

  <!-- App Header -->
  <header>
    <div class="header-inner">
      <div class="brand">🍔 <span>MAK</span> Bites</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search burgers, fries, drinks..." aria-label="Search menu items" />
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="container">
    <section>
      <div class="tabs" id="categoryTabs">
        <button class="tab-btn active" data-category="all">All Items</button>
        <button class="tab-btn" data-category="burgers">Burgers</button>
        <button class="tab-btn" data-category="sides">Sides</button>
        <button class="tab-btn" data-category="drinks">Drinks</button>
        <button class="tab-btn" data-category="combos">Combos</button>
      </div>

      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <!-- Sticky Order Tray -->
    <aside class="cart-panel">
      <div class="cart-header">
        <h2>Your Tray <span class="badge" id="cartCount">0</span></h2>
        <button class="clear-btn" id="clearCartBtn" type="button">Clear</button>
      </div>

      <div class="cart-items" id="cartItems">
        <div class="cart-empty">Your tray is empty. Add something tasty!</div>
      </div>

      <div class="totals">
        <div class="total-row">
          <span>Subtotal</span>
          <span id="subtotalVal">$0.00</span>
        </div>
        <div class="total-row">
          <span>Tax (8%)</span>
          <span id="taxVal">$0.00</span>
        </div>
        <div class="total-row grand">
          <span>Total</span>
          <span id="totalVal">$0.00</span>
        </div>
      </div>

      <button class="checkout-btn" id="checkoutBtn" type="button" disabled>Place Order</button>
    </aside>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <script>
    const MENU_ITEMS = [
      { id: 1, name: "Classic Smash Burger", category: "burgers", price: 8.99, emoji: "🍔", desc: "Double seared beef patty, aged cheddar, pickles, house sauce." },
      { id: 2, name: "Spicy Crispy Chicken", category: "burgers", price: 9.49, emoji: "🍗", desc: "Buttermilk fried chicken breast, Nashville glaze, cool slaw." },
      { id: 3, name: "Truffle Mushroom Melt", category: "burgers", price: 10.99, emoji: "🍄", desc: "Roasted cremini mushrooms, Swiss cheese, garlic aioli." },
      { id: 4, name: "Golden Seasoned Fries", category: "sides", price: 3.49, emoji: "🍟", desc: "Crispy skin-on russet fries tossed in sea salt and paprika." },
      { id: 5, name: "Loaded Cheese Nachos", category: "sides", price: 5.99, emoji: "🧀", desc: "Warm tortilla chips, jalapeno queso, pico de gallo." },
      { id: 6, name: "Mozzarella Sticks (6pc)", category: "sides", price: 4.99, emoji: "🥖", desc: "Herb-breaded mozzarella served with warm marinara dip." },
      { id: 7, name: "Iced Caramel Cold Brew", category: "drinks", price: 3.99, emoji: "🥤", desc: "Slow-steeped coffee over ice with sweet cream swirl." },
      { id: 8, name: "Fresh Mint Lemonade", category: "drinks", price: 3.29, emoji: "🍋", desc: "Squeezed lemons, crushed garden mint, sparkling water." },
      { id: 9, name: "Smash Burger Combo", category: "combos", price: 12.99, emoji: "🍱", desc: "Classic Smash Burger + Golden Fries + Mint Lemonade." },
      { id: 10, name: "Chicken Feast Box", category: "combos", price: 14.49, emoji: "🥡", desc: "Spicy Chicken Burger + Mozzarella Sticks + Cold Brew." }
    ];

    let activeCategory = "all";
    let searchQuery = "";
    let cart = JSON.parse(localStorage.getItem("mak_fastfood_cart") || "[]");
    let toastTimer = null;

    const menuGrid = document.getElementById("menuGrid");
    const categoryTabs = document.getElementById("categoryTabs");
    const searchInput = document.getElementById("searchInput");
    const cartItemsEl = document.getElementById("cartItems");
    const cartCountEl = document.getElementById("cartCount");
    const subtotalVal = document.getElementById("subtotalVal");
    const taxVal = document.getElementById("taxVal");
    const totalVal = document.getElementById("totalVal");
    const checkoutBtn = document.getElementById("checkoutBtn");
    const clearCartBtn = document.getElementById("clearCartBtn");
    const toastContainer = document.getElementById("toast-container");

    function showToast(message) {
      toastContainer.innerHTML = "";
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      toastContainer.appendChild(toast);

      // Force browser reflow so CSS transition triggers reliably
      void toast.offsetWidth;
      toast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 260);
      }, 2400);
    }

    function renderMenu() {
      const filtered = MENU_ITEMS.filter(item => {
        const matchesCat = activeCategory === "all" || item.category === activeCategory;
        const q = searchQuery.toLowerCase().trim();
        const matchesQuery = !q || item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });

      if (!filtered.length) {
        menuGrid.innerHTML = `<div class="empty-state">No menu items match your search. Try another keyword or category.</div>`;
        return;
      }

      menuGrid.innerHTML = filtered.map(item => `
        <article class="food-card">
          <div>
            <div class="food-emoji">${item.emoji}</div>
            <div class="food-category">${item.category}</div>
            <h3 class="food-title">${item.name}</h3>
            <p class="food-desc">${item.desc}</p>
          </div>
          <div class="food-footer">
            <span class="food-price">$${item.price.toFixed(2)}</span>
            <button class="add-btn" type="button" onclick="addToCart(${item.id})">+ Add</button>
          </div>
        </article>
      `).join("");
    }

    function saveCart() {
      localStorage.setItem("mak_fastfood_cart", JSON.stringify(cart));
    }

    function addToCart(id) {
      const item = MENU_ITEMS.find(m => m.id === id);
      if (!item) return;

      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
      }
      saveCart();
      renderCart();
      showToast(`Added ${item.name} to tray`);
    }

    function updateQty(id, delta) {
      const index = cart.findIndex(c => c.id === id);
      if (index === -1) return;

      const itemName = cart[index].name;
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
        showToast(`Removed ${itemName}`);
      }
      saveCart();
      renderCart();
    }

    function renderCart() {
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      cartCountEl.textContent = totalItems;

      if (!cart.length) {
        cartItemsEl.innerHTML = `<div class="cart-empty">Your tray is empty. Add something tasty!</div>`;
        subtotalVal.textContent = "$0.00";
        taxVal.textContent = "$0.00";
        totalVal.textContent = "$0.00";
        checkoutBtn.disabled = true;
        return;
      }

      checkoutBtn.disabled = false;
      cartItemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <span>$${(item.price * item.qty).toFixed(2)} ($${item.price.toFixed(2)} ea)</span>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" type="button" onclick="updateQty(${item.id}, -1)" aria-label="Decrease quantity">-</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" type="button" onclick="updateQty(${item.id}, 1)" aria-label="Increase quantity">+</button>
          </div>
        </div>
      `).join("");

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const tax = subtotal * 0.08;
      const total = subtotal + tax;

      subtotalVal.textContent = `$${subtotal.toFixed(2)}`;
      taxVal.textContent = `$${tax.toFixed(2)}`;
      totalVal.textContent = `$${total.toFixed(2)}`;
    }

    categoryTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      categoryTabs.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.category;
      renderMenu();
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderMenu();
    });

    clearCartBtn.addEventListener("click", () => {
      if (!cart.length) return;
      cart = [];
      saveCart();
      renderCart();
      showToast("Order tray cleared");
    });

    checkoutBtn.addEventListener("click", () => {
      if (!cart.length) return;
      const orderNum = Math.floor(1000 + Math.random() * 9000);
      showToast(`Order #${orderNum} placed! Preparing your food.`);
      cart = [];
      saveCart();
      renderCart();
    });

    renderMenu();
    renderCart();
  </script>
</body>
</html>
